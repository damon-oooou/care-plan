server.port=8080
spring.application.name=care-plan

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:careplan}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Anthropic =====
anthropic.api-key=${ANTHROPIC_API_KEY}

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ===== LLM =====
# 切换 LLM 只改这一行：claude | openai
llm.provider=claude
llm.claude.model=claude-haiku-4-5-20251001
llm.claude.max-tokens=2000
# llm.openai.api-key=${OPENAI_API_KEY}
# llm.openai.model=gpt-4o

# ===== Logging =====
logging.file.name=logs/careplan.log
